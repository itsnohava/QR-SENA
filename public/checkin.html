<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia - SENA Asist</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            background: #041a04;
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        #loading-overlay {
            text-align: center;
            display: block;
        }
        .card {
            background: white;
            color: #1e293b;
            padding: 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: none; /* Hidden until data loaded */
        }
        .header { text-align: center; margin-bottom: 24px; }
        .logo { font-size: 1.4rem; font-weight: 800; color: #041a04; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .badge { background: #f0fdf4; color: #009900; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
        .search-box { position: relative; margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .search-box input { width: 100%; padding: 12px 15px 12px 40px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; box-sizing: border-box; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .list-container { border: 1px solid #e2e8f0; border-radius: 15px; max-height: 350px; overflow-y: auto; margin-bottom: 20px; background: #fff; }
        .student-item { padding: 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; text-align: left; }
        .student-item:last-child { border-bottom: none; }
        .student-item.selected { background: #f0fdf4; border-left: 5px solid #009900; }
        .student-name { font-weight: 700; display: block; color: #1e293b; }
        .student-id { font-size: 0.8rem; color: #64748b; }
        .btn-submit { width: 100%; padding: 15px; background: #009900; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: none; font-family: 'Outfit', sans-serif; transition: background 0.3s; }
        #success-view { display: none; text-align: center; }
        .success-icon { width: 70px; height: 70px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <h2 style="color: #00b33c;">SENA Asist</h2>
        <p id="loading-text">Cargando formulario de asistencia...</p>
    </div>

    <div class="card" id="main-card">
        <div id="form-view">
            <div class="header">
                <div class="logo"><i data-lucide="shield-check"></i> SENA Asist</div>
                <span id="ficha-label" class="badge">Ficha: --</span>
            </div>
            <div class="search-box">
                <i data-lucide="search" style="width: 18px;"></i>
                <input type="text" id="searchInput" placeholder="Busca tu nombre...">
            </div>
            <div id="student-list" class="list-container"></div>
            <button id="submitBtn" class="btn-submit">Confirmar Asistencia</button>
        </div>

        <div id="success-view">
            <div class="success-icon"><i data-lucide="check-circle" style="width: 36px; height: 36px;"></i></div>
            <h2 style="margin-bottom: 10px;">¡Listo!</h2>
            <p id="success-msg" style="color: #64748b; margin-bottom: 25px;"></p>
            <button onclick="location.reload()" class="btn-submit" style="display: block; background: #f1f5f9; color: #475569;">Cerrar</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fichaId = urlParams.get('ficha');
        let allStudents = [];
        let selectedStudent = null;

        async function init() {
            try {
                if (typeof lucide !== 'undefined') lucide.createIcons();
                
                if (!fichaId) {
                    document.getElementById('loading-text').innerHTML = '<span style="color:red">Error: Ficha no detectada en el QR.</span>';
                    return;
                }

                document.getElementById('ficha-label').textContent = `Ficha: ${fichaId}`;
                
                const [studRes, attRes] = await Promise.all([
                    fetch('/api/students'),
                    fetch('/api/attendance')
                ]);
                if (!studRes.ok) throw new Error('No se pudo conectar con el servidor');
                
                const studentsData = await studRes.json();
                const attendanceData = attRes.ok ? await attRes.json() : [];

                const attMap = new Map();
                attendanceData.forEach(a => { if (a.group === fichaId) attMap.set(a.doc, a.status); });

                allStudents = studentsData.filter(s => s.group === fichaId && s.status !== 'Desertor').map(s => ({
                    ...s,
                    currentStatus: attMap.get(s.id) || 'Ausente'
                }));
                
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('main-card').style.display = 'block';
                
                renderList(allStudents);
            } catch (err) {
                document.getElementById('loading-text').innerHTML = '<span style="color:red">Error: ' + err.message + '</span><br><br><button onclick="location.reload()" style="padding:10px; border-radius:8px;">Reintentar</button>';
            }
        }

        function renderList(students) {
            const list = document.getElementById('student-list');
            if (students.length === 0) {
                list.innerHTML = '<div style="padding:30px; text-align:center; color:#64748b;">No hay aprendices registrados en esta ficha.</div>';
                return;
            }
            list.innerHTML = students.map(s => {
                const isPresent = s.currentStatus === 'Presente';
                const badgeStyle = isPresent 
                    ? 'background: #dcfce7; color: #16a34a;' 
                    : (s.currentStatus === 'Tarde' ? 'background: #fef3c7; color: #d97706;' : 'background: #fee2e2; color: #dc2626;');
                return `
                    <div class="student-item" onclick="selectMe(this, '${s.id}', '${s.name.replace(/'/g, "\\'")}')">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <span class="student-name">${s.name}</span>
                                <span class="student-id">Doc: ${s.id}</span>
                            </div>
                            <span class="badge" style="${badgeStyle} font-size:0.75rem; padding: 4px 10px; border-radius:12px;">${s.currentStatus}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectMe(el, id, name) {
            document.querySelectorAll('.student-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            selectedStudent = { id, name };
            const btn = document.getElementById('submitBtn');
            btn.style.display = 'block';
            btn.textContent = `Registrar a ${name.split(' ')[0]}`;
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allStudents.filter(s => s.name.toLowerCase().includes(val) || s.id.includes(val));
            renderList(filtered);
        });

        document.getElementById('submitBtn').addEventListener('click', async () => {
            if (!selectedStudent) return;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Procesando...';

            try {
                const res = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: selectedStudent.name,
                        doc: selectedStudent.id,
                        docType: selectedStudent.docType || '',
                        group: fichaId,
                        status: 'Presente'
                    })
                });
                if (res.ok) {
                    document.getElementById('form-view').style.display = 'none';
                    document.getElementById('success-view').style.display = 'block';
                    document.getElementById('success-msg').textContent = `${selectedStudent.name}, tu asistencia ha sido guardada.`;
                } else {
                    throw new Error('Error al guardar');
                }
            } catch (err) {
                alert('Error: No se pudo registrar. Intenta de nuevo.');
                btn.disabled = false;
                btn.textContent = 'Confirmar Asistencia';
            }
        });

        window.onload = init;
    </script>
</body>
</html>
