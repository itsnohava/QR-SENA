<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SENA AsistQR</title>
    <link rel="icon" href="https://www.sena.edu.co/Style%20Library/alayout/images/logoSena.png?rev=40">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Fondo verde desvanecido superior derecho */
        body::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle at 70% 30%, rgba(0,153,0,0.12) 0%, rgba(0,180,0,0.06) 40%, transparent 70%);
            top: -80px; right: -80px;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        /* Fondo verde desvanecido inferior izquierdo */
        body::after {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle at 30% 70%, rgba(0,153,0,0.10) 0%, rgba(0,180,0,0.04) 40%, transparent 70%);
            bottom: -60px; left: -60px;
            border-radius: 50%;
            animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            position: relative;
            background: #ffffff;
            border: 1px solid rgba(57, 255, 20, 0.6);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3), 
                        0 0 30px rgba(57, 255, 20, 0.15),
                        0 8px 40px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.6s ease-out;
            transition: box-shadow 0.6s ease, border-color 0.6s ease;
            overflow: visible;
        }

        .login-card:hover {
            border-color: rgba(57, 255, 20, 0.9);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4), 
                        0 0 40px rgba(57, 255, 20, 0.25),
                        0 8px 40px rgba(0, 0, 0, 0.1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo img {
            width: 80px;
            height: auto;
            filter: none;
            margin-bottom: 15px;
        }

        .login-logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a2e1a;
            letter-spacing: -0.5px;
        }

        .login-logo p {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #009900;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 14px 48px 14px 44px;
            background: #f8fdf8;
            border: 1.5px solid rgba(0, 170, 0, 0.6);
            border-radius: 12px;
            color: #1a2e1a;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:focus {
            border-color: #009900;
            box-shadow: 0 0 0 3px rgba(0, 153, 0, 0.12);
            background: #f0faf0;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #009900, #006600);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #00aa00, #007700);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 153, 0, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-error {
            display: none;
            background: rgba(239, 68, 68, 0.07);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #009900;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background 0.2s;
            z-index: 2;
        }

        .toggle-password svg {
            position: relative !important;
            left: auto !important;
            top: auto !important;
            transform: none !important;
            width: 18px !important;
            height: 18px !important;
            color: #009900;
            pointer-events: auto;
        }

        .toggle-password:hover {
            background: rgba(0,153,0,0.08);
            color: #006600;
        }

        /* Wrapper relativo para anclar el personaje */
        .login-page-wrapper {
            position: relative;
            z-index: 10;
        }

        /* Personaje asomándose a la IZQUIERDA del card */
        .peek-character {
            position: absolute;
            top: 80px;
            left: -290px;
            width: 300px;
            z-index: 20;
            opacity: 0;
            animation: peekIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: none;
            user-select: none;
        }

        @keyframes peekIn {
            from { opacity: 0; transform: translateX(-40px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* Ocultar personaje en pantallas pequeñas */
        @media (max-width: 900px) {
            .peek-character { display: none; }
        }

        /* ===== Burbujas verde neón por toda la pantalla ===== */
        .sparkle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(120, 255, 80, 0.9), rgba(57, 255, 20, 0.5) 60%, transparent);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.6), 0 0 20px rgba(57, 255, 20, 0.3), inset 0 0 4px rgba(255,255,255,0.3);
            pointer-events: none;
            animation: bubbleFloat 3s ease-in-out infinite;
            z-index: 5;
            transition: transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .sparkle:nth-child(1)  { width: 14px; height: 14px; top: 8%;  left: 5%;  animation-delay: 0s;   animation-duration: 3s; }
        .sparkle:nth-child(2)  { width: 10px; height: 10px; top: 15%; right: 8%; animation-delay: 0.5s; animation-duration: 3.5s; }
        .sparkle:nth-child(3)  { width: 16px; height: 16px; bottom: 12%; left: 10%; animation-delay: 1s; animation-duration: 2.8s; }
        .sparkle:nth-child(4)  { width: 8px;  height: 8px;  top: 40%; left: 3%;  animation-delay: 0.3s; animation-duration: 3.2s; }
        .sparkle:nth-child(5)  { width: 12px; height: 12px; bottom: 25%; right: 6%; animation-delay: 0.7s; animation-duration: 2.6s; }
        .sparkle:nth-child(6)  { width: 10px; height: 10px; top: 60%; right: 12%; animation-delay: 1.3s; animation-duration: 3.3s; }
        .sparkle:nth-child(7)  { width: 8px;  height: 8px;  top: 20%; left: 15%; animation-delay: 0.2s; animation-duration: 3.8s; }
        .sparkle:nth-child(8)  { width: 14px; height: 14px; bottom: 8%; right: 15%; animation-delay: 1.6s; animation-duration: 2.9s; }
        .sparkle:nth-child(9)  { width: 11px; height: 11px; top: 75%; left: 8%;  animation-delay: 0.9s; animation-duration: 3.1s; }
        .sparkle:nth-child(10) { width: 9px;  height: 9px;  top: 5%;  right: 25%; animation-delay: 1.1s; animation-duration: 3.4s; }
        .sparkle:nth-child(11) { width: 13px; height: 13px; bottom: 35%; left: 20%; animation-delay: 0.4s; animation-duration: 2.7s; }
        .sparkle:nth-child(12) { width: 7px;  height: 7px;  top: 50%; right: 3%;  animation-delay: 1.8s; animation-duration: 3.6s; }

        @keyframes bubbleFloat {
            0%, 100% { opacity: 0.4; transform: scale(0.8) translateY(0); }
            50%      { opacity: 1;   transform: scale(1.1) translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="login-page-wrapper">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="sena_logo.png" alt="Logo SENA" style="width: 80px; height: 80px; object-fit: contain;">
                <h1>Control de Asistencia</h1>
                <p>Ingresa tus credenciales para continuar</p>
            </div>

            <div class="login-error" id="loginError">
                Usuario o contraseña incorrectos.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Usuario</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input type="text" id="loginUser" placeholder="Ingresa tu usuario" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="loginPass" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePass()" title="Mostrar/ocultar contraseña">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                SENA © 2026 — Todos los derechos reservados
            </div>
        </div> <!-- Closes login-card -->
    </div> <!-- Closes login-container -->
    <!-- Chica asomándose arriba a la derecha del card -->
    <img src="chica-peek.png" class="peek-character" alt="Chica SENA asomándose">
    </div> <!-- Closes login-page-wrapper -->

    <!-- Burbujas verde neón por toda la pantalla -->
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>
    <span class="sparkle"></span>

    <script>
        // Check if already logged in
        if (sessionStorage.getItem('sena_logged_in') === 'true') {
            window.location.href = 'index.html';
        }

        function togglePass() {
            const input = document.getElementById('loginPass');
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            // Cambiar el icono del ojo
            document.getElementById('eyeIcon').innerHTML = isPassword
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;

            // Cuentas del sistema
            const accounts = [
                { user: 'OBSENA2026@gmail.com',     pass: 'Sena123',   role: 'INSTRUCTOR',  name: 'Juan Pérez' },
                { user: 'coordinador@sena.edu.co',  pass: 'Coord2026', role: 'COORDINADOR', name: 'Pedro Pony' }
            ];

            const match = accounts.find(a =>
                a.user.toLowerCase() === user.toLowerCase() && a.pass === pass
            );

            if (match) {
                sessionStorage.setItem('sena_logged_in', 'true');
                sessionStorage.setItem('sena_user', match.user);
                sessionStorage.setItem('sena_role', match.role);
                sessionStorage.setItem('sena_name', match.name);
                window.location.href = 'index.html';
            } else {
                const err = document.getElementById('loginError');
                err.style.display = 'block';
                err.textContent = 'Usuario o contraseña incorrectos. Verifica tus datos.';
                setTimeout(() => { err.style.display = 'none'; }, 4000);
            }
        });
    </script>

    <script>
        // Burbujas interactivas: siguen la dirección del mouse por toda la pantalla
        const sparkles = document.querySelectorAll('.sparkle');
        const intensities = [1, 0.7, 1.2, 0.5, 0.9, 0.6, 1.1, 0.8, 0.75, 1.05, 0.65, 0.95];

        document.addEventListener('mousemove', (e) => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const offsetX = e.clientX - centerX;
            const offsetY = e.clientY - centerY;

            sparkles.forEach((s, i) => {
                const factor = intensities[i] || 0.8;
                const moveX = (offsetX / centerX) * 30 * factor;
                const moveY = (offsetY / centerY) * 25 * factor;
                s.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
</body>
</html>
